[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-cli"
version = "0.1.0"
description = "Terminal AI Watchdog, Security Guard & Token Optimization Dashboard for Agentic Sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "stevejvv" }
]
keywords = ["ai", "agents", "tui", "dashboard", "security", "claude-code", "ollama", "tokens"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security",
]

dependencies = [
    "textual>=0.50.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "questionary>=2.0.0",
    "psutil>=5.9.0",
    "gitpython>=3.1.40",
    "pydantic>=2.5.0",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[project.urls]
Homepage = "https://github.com/stevejvv/sentinel"
Repository = "https://github.com/stevejvv/sentinel.git"
Issues = "https://github.com/stevejvv/sentinel/issues"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]
